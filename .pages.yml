media:
  input: public
  output: /
  categories:
    - image
content:
  - name: posts
    label: Berichten
    type: collection
    path: src/data/posts
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
        - pinned
        - order
        - published
      sort:
        - order
        - title
        - pinned
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: body
        label: Inhoud
        type: rich-text
        required: true
        options:
          format: html
          media: false
      - name: published
        label: Publiceren
        type: boolean
        default: true
        description: "Uitgeschakeld: dit bericht verschijnt niet op de website."
      - name: pinned
        label: Vastpinnen
        type: boolean
        default: false
        description: Vastgepinde berichten verschijnen boven alle andere berichten.
      - name: order
        label: Volgorde
        type: number
        default: 100
        description: Lagere getallen komen eerst, binnen de vastgepinde en overige
          berichten.
      - name: image
        label: Afbeelding
        type: image
        description: Optioneel. Wordt onder het bericht getoond.
      - name: imageAlt
        label: Beschrijving afbeelding
        type: string
      - name: link
        label: Lees meer (optioneel)
        type: object
        fields:
          - name: url
            label: Link
            type: string
            description: Laat leeg om geen link te tonen.
          - name: label
            label: Linktekst
            type: string
            default: Lees meer
      - name: video
        label: YouTube embed-URL (optioneel)
        type: string
        description: Gebruik een https://www.youtube.com/embed/... URL. Laat leeg om
          geen video te tonen.
  - name: home
    label: Website-instellingen
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: seo
        label: Zoekmachines
        type: object
        fields:
          - name: title
            label: Paginatitel
            type: string
            required: true
          - name: description
            label: Omschrijving
            type: text
            required: true
      - name: hero
        label: Bovenaan
        type: object
        fields:
          - name: title
            label: Naam
            type: string
            required: true
          - name: subtitle
            label: Ondertitel
            type: string
            required: true
          - name: image
            label: Hoofdfoto
            type: image
            required: true
          - name: imageAlt
            label: Beschrijving hoofdfoto
            type: string
            required: true
          - name: badge
            label: Badge
            type: image
            description: Optioneel. Laat de badge leeg om deze te verbergen.
          - name: badgeAlt
            label: Beschrijving badge
            type: string
            description: Optioneel. Laat de badge leeg om deze te verbergen.
      - name: social
        label: Sociale media
        type: object
        fields:
          - name: instagram
            label: Instagram-profiel
            type: string
            required: true
          - name: facebook
            label: Facebook-profiel
            type: string
            required: true
          - name: spotifyEmbed
            label: Spotify embed-URL
            type: string
            required: true
            description: Gebruik de insluit-URL (embed), niet de gewone deel-link.
          - name: instagramPost
            label: Instagram-bericht URL
            type: string
            required: true
          - name: instagramCaption
            label: Instagram-bijschrift
            type: string
            required: true
      - name: footer
        label: Onderaan
        type: object
        fields:
          - name: label
            label: Tekst
            type: string
            required: true
          - name: linkLabel
            label: Linktekst
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true
